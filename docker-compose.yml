#docker compose up -d
#docker compose up --build
services:
  mysql:
    image: mysql:8.0
    container_name: sakanai-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sakania_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - sakanai

  redis:
    image: redis:7-alpine
    container_name: sakanai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - sakanai

  backend:
    build: ./backend
    container_name: sakanai-backend
    restart: unless-stopped
    working_dir: /var/www
    depends_on:
      - mysql
      - redis
    environment:
      # Boosthis is prepended as GLOBAL middleware (bootstrap/app.php), so it
      # ran on every API request and blocked ~4s before the response was sent.
      # Set as a real container env var, not in .env: when bootstrap/cache/config.php
      # exists Laravel skips loading .env entirely, so getenv() would return false.
      BOOSTHIS_DISABLED: "true"
      APP_ENV: "production"
      APP_DEBUG: "false"
      LOG_LEVEL: "warning"
    volumes:
      - ./backend:/var/www
    networks:
      - sakanai

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: sakanai-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app           
      - /app/node_modules         
    environment:
      - CHOKIDAR_USEPOLLING=true 
      # Vite proxies /api to this. Inside the container the API is nginx, which
      # fastcgi_passes to backend:9000 -- there is no Laravel server on 8000.
      - API_PROXY_TARGET=http://nginx
    networks:
      - sakanai

  nginx:
    image: nginx:alpine
    container_name: sakanai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./backend/public:/var/www/public
    depends_on:
      - backend
      - frontend
    networks:
      - sakanai

volumes:
  mysql-data:
  redis-data:

networks:
  sakanai:
    driver: bridge
