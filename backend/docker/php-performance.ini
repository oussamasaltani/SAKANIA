; Performance tuning for the SAKANIA API container.
;
; The application directory is a bind mount (9p/drvfs from the Windows host), so
; every opcode-cache timestamp check is a cross-boundary file stat. Two settings
; below address that measured cost directly.

; --- OPcache sizing -----------------------------------------------------------
; The app tree holds ~15.5k PHP files (vendor + app). The default
; max_accelerated_files is 10000, so the shared-memory hash table cannot hold the
; working set: opcache thrashed, evicting and recompiling scripts on every
; request. Size the table above the real file count so it stops thrashing.
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=30000
opcache.max_wasted_percentage=10

; Re-stat cached scripts every 10 minutes instead of the default 2 seconds.
; On this bind mount each revalidation stat costs milliseconds, and the sweep runs
; over the whole ~15.5k file working set.
opcache.revalidate_freq=600

; --- JIT ----------------------------------------------------------------------
; The image ships opcache.jit_buffer_size=0, which silently leaves JIT off even
; though opcache.jit=tracing is set. Give the buffer a real size.
opcache.jit=tracing
opcache.jit_buffer_size=64M

; --- realpath cache -----------------------------------------------------------
; Realpath resolution is per FPM worker and starts cold on every worker start.
; A larger, longer-lived cache removes a large number of 9p round trips.
realpath_cache_size=4096K
realpath_cache_ttl=600

; --- runtime ------------------------------------------------------------------
memory_limit=256M
max_execution_time=60
