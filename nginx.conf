gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml image/avif image/webp;
gzip_min_length 256;

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10M;

    keepalive_timeout 65;
    keepalive_requests 1000;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Backend API (Laravel / PHP-FPM)
    location /api {
        fastcgi_pass backend:9000;
        fastcgi_keep_conn on;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_read_timeout 300s;
    }

    # Contract PDFs are private documents. They live outside the public web
    # root, but this denies the legacy same-origin path outright as defence in
    # depth: contracts are delivered only by the authenticated endpoint
    # GET /api/contracts/{id}/download. The longer prefix wins over /uploads.
    location /uploads/contracts {
        return 404;
    }

    # Uploads directory
    location /uploads {
        alias /var/www/public/uploads;
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip off;
    }

    # Frontend (Vite Dev Server on Port 5173 + HMR WebSockets)
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;

        # WebSocket support for Vite Hot Module Replacement (HMR)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable proxy buffering in development for instant updates
        proxy_buffering off;
    }
}